# Bring-up model: exercises every engine code path quickly. Not for text quality.
name: bringup
model: {ctx_len: 128, d_model: 32, n_layers: 2, n_heads: 2, d_ff: 64, rms_eps: 1.0e-5}
data: {train: datasets/training/train.jsonl, val: datasets/validation/val.jsonl}
train: {seed: 64, steps: 3000, batch: 128, lr: 3.0e-3, min_lr: 3.0e-4, warmup: 200,
        weight_decay: 0.05, grad_clip: 1.0, log_every: 250, eval_every: 1000}
