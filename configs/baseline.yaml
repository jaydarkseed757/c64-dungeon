# Baseline from docs/ARCHITECTURE.md: d64, 4 layers, 4 heads, ReLU FFN 256, ctx 128.
name: baseline
model: {ctx_len: 128, d_model: 64, n_layers: 4, n_heads: 4, d_ff: 256, rms_eps: 1.0e-5}
data: {train: datasets/training/train.jsonl, val: datasets/validation/val.jsonl}
train: {seed: 64, steps: 12000, batch: 128, lr: 2.0e-3, min_lr: 1.0e-4, warmup: 400,
        weight_decay: 0.05, grad_clip: 1.0, log_every: 500, eval_every: 2000}
