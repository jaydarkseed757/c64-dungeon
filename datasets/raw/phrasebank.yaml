# DM64 phrase bank v1: raw source material for tools/dataset_generator.py
#
# Provenance: original text written for this project by Claude (an AI model)
# during Milestone 2, 2026-11-16. It contains no text copied from games, books
# or other datasets. Replace or extend it by hand freely; the generator
# validates the character set and lengths.
#
# Grammar:
#   rule_name: [alternative, ...]
#   {rule}   expands another rule (chosen at random).
#   {UPPER}  is context-bound: {LOC} -> rule "loc_<value>", {MON} -> "mon_<value>", etc.
#            The value comes from the example's context tokens.
#   Text must be lowercase and use only: a-z 0-9 space . , ! ? ' " - : ;

