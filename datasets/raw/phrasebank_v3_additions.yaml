# ---------------------------------------------------------------- doors and traps
act_open:
  - locked: ["{OBJ} is locked.", "{OBJ} will not open. it is locked.", "the lock on {OBJ} holds fast.", "{OBJ} is locked. you need a key.", "you push, but {OBJ} is locked.", "a rusty lock bars {OBJ}.", "{OBJ} is shut and locked.", "{OBJ} does not move. it is locked tight."]
act_use:
  - success: ["{ITEM} turns in the lock. {OBJ} opens.", "you unlock {OBJ} with {ITEM}.", "with a click, {ITEM} opens {OBJ}.", "{ITEM} fits. {OBJ} swings open.", "you turn {ITEM} and {OBJ} creaks open."]
act_search:
  - trap: ["a trap! a blade springs from the wall.", "click. a dart flies at you!", "a hidden spike jabs your foot!", "you set off a trap. needles strike you!", "the floor gives way. stakes cut your legs!", "a trap snaps shut on your hand."]

