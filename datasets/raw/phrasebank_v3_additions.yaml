# DM64 phrase bank v3 additions (Milestone 8, 2026-11-18)
#
# Provenance: original text written for this project by Claude (an AI model),
# like phrasebank.yaml and phrasebank_v2_additions.yaml. No text is copied from
# games, books or other datasets.
#
# Merged onto phrasebank.yaml + phrasebank_v2_additions.yaml by
# tools/dataset_generator.py --extra (make dataset-v3). Aims:
#   - game texts that fit the game's 48-token limit: roomshort_* are short room
#     openings, used when a second sentence (object, monster, event) follows
#   - more locked-door, key and trap lines (the game's door and trap events)
#   - more ways to type a question (typos are added by the generator)
#   - more variety for rooms, monsters and treasure

task_weights: {ROOM: 0.22, MONSTER: 0.12, TREASURE: 0.12, NPC: 0.05, QUEST: 0.03, EVENT: 0.05,
               COMBAT: 0.13, ACTION: 0.16, FREE: 0.12}
# share of ACTION examples drawn from the game's own door and trap records
game_boost: 0.3
# share of room examples with a second sentence that use a roomshort_* opening
roomshort_share: 0.8

