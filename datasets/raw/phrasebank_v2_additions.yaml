# DM64 phrase bank v2 additions: merged onto phrasebank.yaml (v1) by
#   tools/dataset_generator.py --extra datasets/raw/phrasebank_v2_additions.yaml --tag v2
#
# Provenance: original text written for this project by Claude (an AI model),
# 2026-11-17. No text copied from games, books or other datasets.
#
# Merge rules: a list here is appended to the v1 list of the same name (or creates
# a new rule). act_* entries add alternatives per outcome. task_weights replaces the
# generator's task mix.
#
# Consistency rule (the narrator must never contradict the game): room text never
# names monsters, items or exits that are not in the context; combat text never
# states numbers; kill text never promises loot.

task_weights: {ROOM: 0.20, MONSTER: 0.10, TREASURE: 0.10, NPC: 0.07, QUEST: 0.05, EVENT: 0.06,
               COMBAT: 0.14, ACTION: 0.16, FREE: 0.12}

